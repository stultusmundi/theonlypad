name: macOS verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit and temporary-file tests
        run: scripts/swift.sh test
      - name: Public-source checks
        run: python3 scripts/check-public.py
      - name: Source formatting
        run: xcrun swift-format lint --strict --recursive Sources Tests Package.swift
      - name: Native integration
        run: scripts/test-native-integration.sh
      - name: Managed document lifecycle integration
        run: scripts/test-managed-documents.sh
      - name: Document transfer foundations
        run: |
          scripts/test-document-transfer-registry.sh
          bash scripts/test-application-document-transfer-process.sh
          scripts/test-application-document-transfer-publisher.sh
          scripts/test-native-document-transfer.sh
          scripts/test-editor-transfer-projection.sh
          bash scripts/test-native-application-document-transfer.sh
          bash scripts/test-document-move-destination.sh
          build_path=$(scripts/swift.sh build --show-bin-path)
          scripts/test-file-state-bridge.sh "$build_path"
          scripts/test-native-endpoint-bindings.sh "$build_path"
      - name: Shortcut ownership and native recording
        run: |
          scripts/test-application-shortcuts.sh
          scripts/test-shortcut-application.sh
          scripts/test-session-presentation-flow.sh
          scripts/test-application-documents.sh
          scripts/test-document-adoption.sh
          scripts/test-document-history.sh
          scripts/test-application-document-closing.sh
          scripts/test-application-session-checkpoints.sh
          scripts/test-application-document-intake.sh
          scripts/test-session-capacity.sh
          scripts/test-session-import-claims.sh
          scripts/test-checkpoint-pause.sh
          scripts/test-recovery-close.sh
          build_path=$(scripts/swift.sh build --show-bin-path)
          scripts/test-shortcut-recorder.sh "$build_path"
          scripts/test-shortcut-editor.sh "$build_path"
          scripts/test-native-presentation-refresh.sh "$build_path"
          scripts/test-pane-session.sh "$build_path"
          scripts/test-pane-save.sh "$build_path"
          scripts/test-document-recovery-ownership.sh "$build_path"
          scripts/test-document-factory.sh "$build_path"
          scripts/test-native-close-model.sh "$build_path"
      - name: Package promotion rollback tests
        run: python3 scripts/test-package-promotion.py
      - name: Local package
        run: scripts/package.sh
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
