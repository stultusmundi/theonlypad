name: macOS verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Swift toolchain version
        run: /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin /usr/bin/xcrun swift --version
      - name: Unit and temporary-file tests
        id: core
        run: env NSUnbufferedIO=YES python3 scripts/run-owned-search-tests.py --timeout 600 --output .local/ci-core -- scripts/swift.sh test
      - name: Bounded core failure diagnostics
        if: ${{ failure() && steps.core.outcome == 'failure' }}
        run: |
          python3 scripts/ci_owned_failure_diagnostics.py || python3 scripts/ci_owned_failure_diagnostics.py --summary-only
      - name: Bounded core error-family detail
        if: ${{ failure() && steps.core.outcome == 'failure' }}
        run: python3 scripts/ci_owned_failure_diagnostics.py --error-detail
      - name: Bounded folder preview phase diagnostic
        if: ${{ failure() && steps.core.outcome == 'failure' }}
        run: python3 -B scripts/ci_folder_preview_trace.py
      - name: CI failure diagnostic contract tests
        run: env NSUnbufferedIO=YES python3 scripts/run-owned-search-tests.py --timeout 30 --output .local/ci-diagnostics-test -- python3 -B -m unittest discover -s Tests/CIDiagnostics -p 'test_*.py'
      - name: Owned search test infrastructure
        run: |
          python3 -m unittest discover -s Tests/SearchChildIntegration -p 'test_*.py'
          scripts/test-search-child-lifecycle.sh
      - name: Parent search driver ownership integration
        run: |
          python3 -m unittest discover -s Tests/SearchParentDriverIntegration -p 'test_*.py'
          scripts/test-search-parent-driver.sh
      - name: Application document search panel, session and ownership
        run: |
          python3 -B -m unittest discover -s Tests/DocumentSearchPanelIntegration -p test_public_panel_runner.py
          scripts/test-document-search-panel.sh
      - name: Application search coordinator component
        run: |
          python3 -B -m unittest discover -s Tests/NativeApplicationSearchesIntegration -p test_native_application_searches_runner.py
          scripts/test-native-application-searches.sh
      - name: Native language catalog ownership
        run: scripts/test-native-language-catalog.sh
      - name: Application language catalog and manager
        run: scripts/test-application-language-catalog.sh
      - name: Native document storage snapshots
        run: scripts/test-document-text-storage.sh
      - name: Managed document-search editor binding
        run: scripts/test-document-search.sh
      - name: Managed document-search application routing
        run: scripts/test-document-search-app.sh
      - name: Managed document search with same-source helper
        run: scripts/test-document-search-real-helper.sh
      - name: Readonly folder preview native component
        run: scripts/test-folder-replacement-preview.sh
      - name: Disk conflict presentation and Locate context
        run: scripts/test-disk-conflict-presentation.sh
      - name: Fixed search helper protocol integration
        run: |
          python3 -m unittest discover -s Tests/SearchWorkerIntegration -p 'test_*.py'
          scripts/test-search-worker.sh
      - name: Public-source checks
        run: python3 scripts/check-public.py
      - name: Source formatting
        run: xcrun swift-format lint --strict --recursive Sources Tests Package.swift
      - name: Native integration
        run: scripts/test-native-integration.sh
      - name: Search replacement callback safety
        run: scripts/test-search-replacement.sh
      - name: Offline Help search and shortcut reference
        run: scripts/test-help-reference.sh
      - name: Managed document lifecycle integration
        run: scripts/test-managed-documents.sh
      - name: Managed startup editor routing
        run: scripts/test-managed-admission.sh
      - name: Document transfer foundations
        run: |
          python3 -m unittest discover -s Tests/NativeIntegration -p 'test_*.py'
          scripts/test-document-transfer-registry.sh
          bash scripts/test-application-document-transfer-process.sh
          scripts/test-application-document-transfer-publisher.sh
          scripts/test-native-document-transfer.sh
          scripts/test-editor-transfer-projection.sh
          bash scripts/test-native-application-document-transfer.sh
          bash scripts/test-document-move-destination.sh
          build_path=$(scripts/swift.sh build --show-bin-path)
          scripts/test-file-state-bridge.sh "$build_path"
          scripts/test-native-endpoint-bindings.sh "$build_path"
      - name: Native macro recording regressions
        run: scripts/test-native-macro.sh
      - name: Native approval ownership regressions
        run: |
          python3 -B -m unittest discover -s Tests/NativeApprovalIntegration -p 'test_*.py'
          scripts/test-native-approval-regressions.sh
      - name: Shortcut ownership and native recording
        run: |
          scripts/test-application-shortcuts.sh
          scripts/test-shortcut-application.sh
          scripts/test-session-presentation-flow.sh
          scripts/test-application-documents.sh
          scripts/test-document-adoption.sh
          scripts/test-document-history.sh
          scripts/test-application-document-closing.sh
          scripts/test-application-session-checkpoints.sh
          scripts/test-application-document-intake.sh
          scripts/test-session-capacity.sh
          scripts/test-session-import-claims.sh
          scripts/test-checkpoint-pause.sh
          scripts/test-recovery-close.sh
          build_path=$(scripts/swift.sh build --show-bin-path)
          scripts/test-shortcut-recorder.sh "$build_path"
          scripts/test-shortcut-editor.sh "$build_path"
          scripts/test-native-presentation-refresh.sh "$build_path"
          scripts/test-pane-session.sh "$build_path"
          scripts/test-pane-save.sh "$build_path"
          scripts/test-document-recovery-ownership.sh "$build_path"
          scripts/test-document-factory.sh "$build_path"
          scripts/test-native-close-model.sh "$build_path"
      - name: Package validation and promotion rollback tests
        run: |
          python3 scripts/test-package-validation.py
          python3 scripts/test-package-promotion.py
      - name: Local package
        run: scripts/package.sh
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
